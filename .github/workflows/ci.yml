name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pyright coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Ruff (Lint & Formatting)
      run: |
        ruff check generators/execution/
        ruff format --check generators/execution/
        
    - name: Run MyPy (Type Checking)
      run: |
        mypy generators/execution/
        
    - name: Run Pyright (Type Checking)
      run: |
        pyright generators/execution/
        
    - name: Run Tests with Coverage
      run: |
        coverage run -m unittest discover -s generators/execution/tests -v
        coverage report -m --fail-under=90
