name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # This repo is not an installable package — dependencies only (no pip install -e).
          pip install \
            pydantic \
            PyYAML \
            pytest \
            coverage \
            ruff

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Tests
        run: |
          coverage run -m pytest
          # fail_under also set in pyproject.toml [tool.coverage.report]
          coverage report -m --fail-under=60