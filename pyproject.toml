# Tooling configuration only.
# This repository is NOT packaged or published.
# Run from the repository root with: python3 build_dataset.py
# Install runtime/dev dependencies with pip (no editable install).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
branch = true
# Measured surface: framework layers + generators with meaningful tests.
# Untested / sparse generators are omitted intentionally — see AUDIT_RESOLUTION.md.
source = [
    "sources",
    "protocol",
    "preprocessing",
    "validation",
    "generators/context",
    "generators/approval",
    "generators/common/contract",
    "generators/common/pipeline",
]
omit = [
    "generators/conversation/*",
    "generators/evaluation/*",
    "generators/execution/*",
    "generators/planner/*",
    "generators/coding/*",
    "generators/repair/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra -q --import-mode=importlib"
markers = [
    "integration: marks tests as integration tests",
]
