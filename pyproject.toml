[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiodoo-datasets"
version = "1.0.0"
description = "Deterministic AI dataset generators for Odoo."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "AIODOO Team"}
]
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools]
package-dir = {"aiodoo_datasets" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["generators*", "tests*", "protocol*", "validation*", "statistics*", "cli*", "analysis*", "builders*", "domain*", "factories*", "registries*", "preprocessing*", "sources*", "config*"]
namespaces = false

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pyright",
    "pytest",
    "coverage",
]

[project.scripts]
generate-planner = "aiodoo_datasets.generators.planner.cli.main:main"
generate-coding = "aiodoo_datasets.generators.coding.cli.main:main"
generate-repair = "aiodoo_datasets.generators.repair.cli.main:main"
generate-context = "aiodoo_datasets.generators.context.cli.main:main"
generate-execution = "aiodoo_datasets.generators.execution.cli.main:main"
generate-approval = "aiodoo_datasets.generators.approval.cli.main:main"
generate-conversation = "aiodoo_datasets.generators.conversation.cli.main:main"
generate-evaluation = "aiodoo_datasets.generators.evaluation.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "generators.*.tests.*"
disable_error_code = ["no-untyped-def", "no-untyped-call", "misc", "var-annotated"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib"
markers = [
    "integration: marks tests as integration tests",
]
testpaths = [
    "generators",
]

[tool.coverage.run]
branch = true
source = ["generators"]

[tool.coverage.report]
show_missing = true
fail_under = 90
