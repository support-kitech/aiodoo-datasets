[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiodoo-datasets"
version = "1.0.0"
description = "Deterministic AI dataset generators for Odoo."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "AIODOO Team" }
]

dependencies = [
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
branch = true
source = [
    "generators",
    "sources",
    "preprocessing",
    "protocol",
    "validation",
    "statistics",
]

[tool.coverage.report]
show_missing = true
fail_under = 65