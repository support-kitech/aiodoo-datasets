[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiodoo-datasets"
version = "1.0.0"
description = "Deterministic AI dataset generators for Odoo."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "AIODOO Team"}
]
dependencies = [
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[tool.setuptools]



[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "coverage",
]

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib"
markers = [
    "integration: marks tests as integration tests",
]
testpaths = [
    "generators",
]

[tool.coverage.run]
branch = true
source = ["generators"]

[tool.coverage.report]
show_missing = true
fail_under = 65
